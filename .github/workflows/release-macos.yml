name: Release macOS binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin

    steps:
      - name: Check out release
        uses: actions/checkout@v7

      - name: Install Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Test
        run: cargo test --locked

      - name: Build library
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      - name: Build C example
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cc \
            -Iinclude \
            -o "target/$TARGET/release/httpcli" \
            examples/httpcli.c \
            "target/$TARGET/release/libruxc.a" \
            -framework Security

      - name: Package release archive
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          package="ruxc-macos-$ARCH"
          package_dir="dist/$package"

          mkdir -p "$package_dir/bin" "$package_dir/include" "$package_dir/lib"
          cp "target/$TARGET/release/httpcli" "$package_dir/bin/"
          cp include/ruxc.h "$package_dir/include/"
          cp "target/$TARGET/release/libruxc.a" "$package_dir/lib/"
          cp "target/$TARGET/release/libruxc.dylib" "$package_dir/lib/"
          cp LICENSE README.md "$package_dir/"

          tar -C dist -czf "dist/$package.tar.gz" "$package"
          cd dist
          shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Attach binaries to release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-macos-*
          path: dist
          merge-multiple: true

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --clobber
